name: Build Deb Ubuntu 24.04

env:
  BUILD_CONTEXT: ./deb2404

on:
  workflow_dispatch:
    inputs:
      push-images:
        description: "Push built images to registries"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "deb2404/**"
      - "variables.env"
  pull_request:
    branches:
      - main
    paths:
      - "deb2404/**"
      - "variables.env"

  workflow_call:
    secrets:
      REGISTRY_PASSWORD_DOCKER:
        required: true
      PUBLISH_TO_GITHUB_REPO_TOKEN:
        required: true
    inputs:
      push-images:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.push-images || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - run: ls -l
      - run: cat ./variables.env >> $GITHUB_ENV
      - run: cat ${{ env.BUILD_CONTEXT }}/variables.env >> $GITHUB_ENV

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.SHOULD_PUSH }}
        with:
          username: ${{ env.REGISTRY_USERNAME_DOCKER }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.SHOULD_PUSH }}
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USERNAME_GHCR }}
          password: ${{ secrets.PUBLISH_TO_GITHUB_REPO_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: ${{ env.SHOULD_PUSH }}
          tags: |
            ${{ env.REGISTRY_USERNAME_DOCKER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REGISTRY_USERNAME_GHCR }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
