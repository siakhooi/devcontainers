name: Build latex

env:
  BUILD_CONTEXT: ./latex

on:
  workflow_dispatch:
    inputs:
      push-images:
        description: "Push built images to registries"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "latex/**"
      - "variables.env"
  pull_request:
    branches:
      - main
    paths:
      - "latex/**"
      - "variables.env"

  workflow_call:
    secrets:
      REGISTRY_PASSWORD_DOCKER:
        required: true
      PUBLISH_TO_GITHUB_REPO_TOKEN:
        required: true
    inputs:
      push-images:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.push-images || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - run: ls -l
      - run: cat ./variables.env >> $GITHUB_ENV
      - run: cat ${{ env.BUILD_CONTEXT }}/variables.env >> $GITHUB_ENV

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.SHOULD_PUSH }}
        with:
          username: ${{ env.REGISTRY_USERNAME_DOCKER }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.SHOULD_PUSH }}
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USERNAME_GHCR }}
          password: ${{ secrets.PUBLISH_TO_GITHUB_REPO_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: ${{ env.SHOULD_PUSH }}
          tags: |
            ${{ env.REGISTRY_USERNAME_DOCKER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REGISTRY_USERNAME_GHCR }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
